name: BuildIt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: "Clone source"
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: "Setup MSVC"
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Build DLL"
        run: |
          mkdir -p build
          cd build
          cmake -G "NMake Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ..
          cmake --build .

          # ИСПРАВЛЕНО: проверяем правильное имя DLL
          if [ ! -f cslol-dll-legacy.dll ]; then
            echo "ERROR: cslol-dll-legacy.dll не найден!"
            exit 1
          fi
        shell: bash

      - name: "Package DLL"
        run: |
          # ИСПРАВЛЕНО: используем правильное имя файла
          7z a cslol-patcher.zip build/cslol-dll-legacy.dll
          7z rn cslol-patcher.zip build/ cslol-patcher/
        shell: bash

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: cslol-patcher
          path: cslol-patcher.zip
          retention-days: 15
