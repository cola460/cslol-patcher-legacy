name: BuildIt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # включаем Node.js 24 для всех шагов

    steps:
      - name: "Clone source"
        uses: actions/checkout@v3  # новая версия checkout
        with:
          submodules: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: "Setup MSVC"
        uses: ilammy/msvc-dev-cmd@v2  # новая версия msvc setup
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: "Build"
        run: |
          mkdir build
          cd build
          cmake -G "NMake Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ..
          cmake --build .
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: "Package"
        run: |
          7z a cslol-patcher.zip build/cslol-*
          7z rn cslol-patcher.zip build/ cslol-patcher/
        shell: bash
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4  # последняя версия upload-artifact
        with:
          name: cslol-patcher
          path: cslol-patcher.zip
          retention-days: 15
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
